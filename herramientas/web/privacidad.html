<!doctype html>
<html lang="{{html_lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{privacy_page_title}}</title><link rel="canonical" href="{{canonical}}">{{alternates}}
<style>
  :root { --bg:#ffffff; --fg:#1b1f24; --muted:#57606a; --accent:#3b6fd8; --line:#d0d7de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e3e6ea; --muted:#a9b2bd; --accent:#6fb3ff; --line:#30363d; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.8rem; margin:0 0 4px; } h2 { font-size:1.2rem; margin-top:2rem; border-bottom:1px solid var(--line); padding-bottom:4px; }
  .muted { color:var(--muted); } a { color:var(--accent); } li { margin:4px 0; }
  nav a { margin-right:12px; }

  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px; }
  .lang { display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 12px 0 10px; border-radius:999px; border:1px solid var(--line); background:transparent; font:600 14px system-ui,sans-serif; color:var(--fg); cursor:pointer; }
  .lang img { width:22px; height:auto; border-radius:3px; } .lang .cv { opacity:.6; font-size:11px; }
  .zh { display:inline-flex; width:22px; height:16px; border-radius:3px; background:var(--line); align-items:center; justify-content:center; font:700 10px sans-serif; }
  .note { border-left:3px solid var(--accent); padding:4px 12px; color:var(--muted); }
  dialog.langs { border:0; padding:0; background:transparent; color:inherit; max-width:none; max-height:none; width:100%; height:100%; }
  dialog.langs::backdrop { background:rgba(0,0,0,.55); }
  .sheet { position:fixed; left:50%; top:60px; transform:translateX(-50%); width:min(560px,94vw); max-height:84vh; overflow:auto; background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:16px 18px 22px; }
  .grab { display:none; } .sheet h3 { margin:0 0 4px; font-size:1.2rem; }
  .rg { font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:14px 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .it { display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 2px; border-radius:12px; border:1px solid transparent; font-size:12px; font-weight:600; color:var(--fg); text-align:center; line-height:1.15; text-decoration:none; }
  .it:hover { background:var(--line); } .it img { width:32px; height:auto; border-radius:4px; } .it .zh { width:32px; height:23px; font-size:13px; }
  .it.on { border-color:var(--accent); }
</style>
</head>
<body>
<main>
<div class="top"><a href="{{home}}">{{privacy_back}}</a>{{picker}}</div>
<h1>{{privacy_title}}</h1>
<p class="muted">{{privacy_updated}}</p>
<p class="note">{{privacy_binding}}</p>

{{privacy_html}}
</main>
{{dialog}}{{script}}
</body>
</html>
